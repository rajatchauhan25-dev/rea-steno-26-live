<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STENO 2026 — Reasoning Mock Series</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3b6df0;
    --blue-dark:#2952c8;
    --purple:#8b3fe8;
    --green:#17a668;
    --ink:#1a2233;
    --bg:#f4f6fb;
    --panel-border:#e2e6ee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:'Inter',Arial,sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3{font-family:'Poppins',Arial,sans-serif;}

  .hero{background:linear-gradient(135deg,#3b6df0,#8b3fe8);color:#fff;padding:56px 20px 64px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%, rgba(255,255,255,.12), transparent 40%),radial-gradient(circle at 80% 80%, rgba(255,255,255,.10), transparent 40%);}
  .hero-inner{position:relative;z-index:1;max-width:760px;margin:0 auto;}
  .hero .badge{display:inline-block;background:rgba(255,255,255,.18);padding:6px 16px;border-radius:20px;font-size:12.5px;font-weight:700;letter-spacing:.6px;margin-bottom:16px;}
  .hero h1{font-size:34px;margin:0 0 10px;letter-spacing:.3px;}
  .hero p{font-size:15.5px;opacity:.92;margin:0;line-height:1.6;}

  .wrap{max-width:1080px;margin:-34px auto 60px;padding:0 20px;position:relative;z-index:2;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}

  .card{background:#fff;border-radius:16px;padding:0;box-shadow:0 10px 30px rgba(30,40,80,.10);border:1px solid var(--panel-border);text-decoration:none;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease;}
  .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(30,40,80,.16);}
  .card-top{background:linear-gradient(135deg,#3b6df0,#8b3fe8);padding:22px 20px 18px;color:#fff;position:relative;}
  .card-top .num{font-family:'Poppins',sans-serif;font-weight:800;font-size:34px;line-height:1;}
  .card-top .num span{font-size:14px;font-weight:600;opacity:.85;display:block;margin-top:4px;}
  .card-top .icon{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .card-body{padding:18px 20px 20px;flex:1;display:flex;flex-direction:column;gap:10px;}
  .card-body h3{margin:0;font-size:16px;}
  .card-body .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:#6b7280;}
  .card-body .meta span{background:#f1f3f9;padding:3px 9px;border-radius:20px;font-weight:600;}
  .card-cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13.5px;color:var(--blue-dark);padding-top:6px;}
  .card-cta .arrow{transition:transform .15s ease;}
  .card:hover .card-cta .arrow{transform:translateX(4px);}

  footer{text-align:center;padding:0 20px 50px;color:#8a90a2;font-size:12.5px;}
  footer a{color:var(--blue);text-decoration:none;font-weight:600;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <span class="badge">SSC STENOGRAPHER 2026</span>
    <h1>Reasoning Mock Series</h1>
    <p>10 full-length practice mocks by Balram Sir — pick a set below to start. Each mock opens in a new tab with its own timer, palette, and detailed solutions.</p>
  </div>
</div>

<div class="wrap">
  <div class="grid" id="cardGrid"></div>
</div>

<footer>The SSC Scholars Official &middot; Practice consistently, score higher.</footer>

<script>
  const TOTAL_MOCKS = 10;
  const grid = document.getElementById('cardGrid');
  let html = '';
  for(let i = 1; i <= TOTAL_MOCKS; i++){
    const num = String(i).padStart(2, '0');
    html += `
      <a class="card" href="steno_2026_reasoning_${num}.html" target="_blank" rel="noopener">
        <div class="card-top">
          <div class="icon">📝</div>
          <div class="num">${num}<span>MOCK TEST</span></div>
        </div>
        <div class="card-body">
          <h3>Reasoning Mock ${num}</h3>
          <div class="meta">
            <span>50 Questions</span>
            <span>50 Marks</span>
          </div>
          <div class="card-cta">Start Test <span class="arrow">→</span></div>
        </div>
      </a>`;
  }
  grid.innerHTML = html;
</script>

</body>
</html>
